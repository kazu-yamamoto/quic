name: Haskell CI

on:
  push:
    branches: [ 'main', 'ci' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:  [ 'ubuntu-latest', 'macOS-latest', 'windows-latest' ]
        ghc: [ '9.2', '9.4', '9.6', '9.8', '9.10', '9.12' ]
        # GitHub runs at most five macOS jobs at once, so the sixth sat
        # waiting for one of the others to finish and by itself decided when
        # the workflow ended.  Nothing in this package is macOS-specific
        # beyond the syscalls the network code makes, and those do not vary
        # by compiler; keep the oldest and newest there and let Linux cover
        # the range in between.
        #
        # Windows is here for one thing, which is the I/O manager the test
        # suite runs under, and that does not vary by compiler either.
        exclude:
          - { os: macOS-latest, ghc: '9.4'  }
          - { os: macOS-latest, ghc: '9.6'  }
          - { os: macOS-latest, ghc: '9.8'  }
          - { os: macOS-latest, ghc: '9.10' }
          - { os: windows-latest, ghc: '9.2'  }
          - { os: windows-latest, ghc: '9.4'  }
          - { os: windows-latest, ghc: '9.6'  }
          - { os: windows-latest, ghc: '9.8'  }
          - { os: windows-latest, ghc: '9.10' }

    env:
      cache-name: cabal-ghc
      # -f qlog: the test suite writes qlog only with this on, and the step
      # after the run carries it away when a job fails.  A stall in IOSpec
      # shows up as a test name and "ConnectionIsTimeout", which does not say
      # why; the trace does.
      target-config: --test-show-details=streaming --enable-tests --disable-benchmarks -f qlog

    steps:
    - run: git config --global core.autocrlf false

    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      id: setup
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: latest

    # The store, and only the store: it holds the built dependencies, which
    # is the whole of what takes time.  The package index is deliberately not
    # kept with them -- restored together, the index goes back to whatever
    # was current when the cache was written, and the job cannot see anything
    # published since, however long ago that was.  A cabal update run before
    # the restore is simply overwritten, so the two have to be apart.
    #
    # And the store is found by asking the setup step rather than by naming
    # ~/.cabal, which is not where it is on Windows: that job was building
    # every dependency from scratch every time.
    - name: Restore Cache
      uses: actions/cache/restore@v4
      if: ${{ github.ref_name != 'ci-uc' }}
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ env.cache-name }}-${{ runner.os }}-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}

    - name: Hackage index
      shell: bash
      run: cabal update

    - name: Install doctest
      id: doctest-dep
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        if cabal install --offline --overwrite-policy=always doctest
        then
          echo "installed=false" >> "$GITHUB_OUTPUT"
        else
          cabal install doctest --overwrite-policy=always
          echo "installed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies
      id: inst-dep
      shell: bash
      run: |
        if cabal build --offline --only-dependencies ${{ env.target-config }} all
        then
          echo "installed=false" >> "$GITHUB_OUTPUT"
        else
          cabal build --only-dependencies ${{ env.target-config }} all
          echo "installed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save Cache
      uses: actions/cache/save@v4
      if: ${{ steps.inst-dep.outputs.installed == 'true' || steps.doctest-dep.outputs.installed == 'true' }}
      with:
        path: ${{ steps.setup.outputs.cabal-store }}
        key: ${{ env.cache-name }}-${{ runner.os }}-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}

    - name: Build
      run: cabal build ${{ env.target-config }} all

    - name: Run tests
      run: cabal test ${{ env.target-config }} all

    - name: Keep the qlog of a failed run
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: qlog-${{ matrix.os }}-${{ matrix.ghc }}
        path: qlog
        retention-days: 7

    - name: Run doctest
      if: ${{ runner.os == 'Linux' }}
      run: |
        cabal repl --build-depends=QuickCheck --with-repl=doctest ${{ env.target-config }}
