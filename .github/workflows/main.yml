name: Haskell CI

on:
  push:
    branches: [ 'main', 'ci' ]
  pull_request:
    branches: [ 'main' ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:  [ 'ubuntu-latest', 'macOS-latest' ]
        ghc: [ '9.2', '9.4', '9.6', '9.8', '9.10', '9.12' ]
        # GitHub runs at most five macOS jobs at once, so the sixth sat
        # waiting for one of the others to finish and by itself decided when
        # the workflow ended.  Nothing in this package is macOS-specific
        # beyond the syscalls the network code makes, and those do not vary
        # by compiler; keep the oldest and newest there and let Linux cover
        # the range in between.
        exclude:
          - { os: macOS-latest, ghc: '9.4'  }
          - { os: macOS-latest, ghc: '9.6'  }
          - { os: macOS-latest, ghc: '9.8'  }
          - { os: macOS-latest, ghc: '9.10' }

    env:
      cache-name: cabal-ghc
      target-config: --test-show-details=streaming --enable-tests --disable-benchmarks

    steps:
    - run: git config --global core.autocrlf false

    - uses: actions/checkout@v4

    - uses: haskell-actions/setup@v2
      with:
        ghc-version: ${{ matrix.ghc }}
        cabal-version: latest

    - name: Cache Key
      id: params
      shell: bash
      run: |
        ghc_version=$(ghc --numeric-version)
        echo "cache=${{ runner.os }}-build-${{ env.cache-name }}-${ghc_version}-${{ hashFiles('**/*.cabal') }}-${{ hashFiles('**/cabal.project') }}" > "$GITHUB_OUTPUT"
        echo "ghc_version=$ghc_version" >> "$GITHUB_OUTPUT"

    - name: Restore Cache
      uses: actions/cache/restore@v4
      if: ${{ github.ref_name != 'ci-uc' }}
      with:
        path: ~/.cabal
        key: ${{ steps.params.outputs.cache }}

    # After the restore, not before it.  The cache is ~/.cabal, which is where
    # the package index lives, so restoring it puts back whatever index was
    # current when the cache was written -- and a cabal update run first is
    # simply overwritten.  A job then cannot see anything published since the
    # cache was made, however long ago that was.
    - name: Hackage index
      shell: bash
      run: cabal update

    # doctest 0.25.0 rejects the --interactive that cabal puts in the GHC
    # response file it hands the repl program, so the doctest step below dies
    # before it reads a single example.  Reported as sol/doctest#487; drop the
    # constraint once that is fixed.
    - name: Install doctest
      id: doctest-dep
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        if cabal install --offline --overwrite-policy=always doctest --constraint='doctest < 0.25'
        then
          echo "installed=false" >> "$GITHUB_OUTPUT"
        else
          cabal install doctest --overwrite-policy=always --constraint='doctest < 0.25'
          echo "installed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Install dependencies
      id: inst-dep
      shell: bash
      run: |
        if cabal build --offline --only-dependencies ${{ env.target-config }} all
        then
          echo "installed=false" >> "$GITHUB_OUTPUT"
        else
          cabal build --only-dependencies ${{ env.target-config }} all
          echo "installed=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Save Cache
      uses: actions/cache/save@v4
      if: ${{ steps.inst-dep.outputs.installed == 'true' || steps.doctest-dep.outputs.installed == 'true' }}
      with:
        path: ~/.cabal
        key: ${{ steps.params.outputs.cache }}

    - name: Build
      run: cabal build ${{ env.target-config }} all

    - name: Run tests
      run: cabal test ${{ env.target-config }} all

    - name: Run doctest
      if: ${{ runner.os == 'Linux' }}
      run: |
        cabal repl --build-depends=QuickCheck --with-repl=doctest ${{ env.target-config }}
